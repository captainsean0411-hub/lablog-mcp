[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lablog-mcp"
version = "0.1.0"
description = "A lightweight MCP server to parse and synthesize experimental Markdown notes along a timeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.1.0",
]

[project.scripts]
lablog-mcp = "lablog_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lablog_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
